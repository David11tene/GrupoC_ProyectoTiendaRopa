spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tienda_ropa?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      enabled: true

server:
  port: 8080
